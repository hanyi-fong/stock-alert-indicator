<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Alert Signals</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script>
        // Fix pathing for local testing when serving from project root
        if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
            const base = document.createElement('base');
            base.href = '/docs/';
            document.head.appendChild(base);
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-glow"></div>
    <div class="container">
        <header>
            <div class="header-content">
                <h1>Signal Tracker</h1>
                <p>10-Day Performance Verification Engine</p>
            </div>
            <div class="stats" id="global-stats">
                <!-- Core Summary -->
                <div class="stat-group">
                    <div class="stat-box highlight">
                        <span class="stat-value" id="stat-signals">0</span>
                        <span class="stat-label">Active</span>
                    </div>
                    <div class="stat-box highlight">
                        <span class="stat-value" id="stat-closed">0</span>
                        <span class="stat-label">Closed</span>
                    </div>
                    <div class="stat-box highlight">
                        <span class="stat-value" id="stat-winrate">0%</span>
                        <span class="stat-label">Win Rate</span>
                    </div>
                </div>

                <!-- Detailed Breakdown -->
                <div class="stat-group breakdown">
                    <div class="stat-column">
                        <div class="group-header">Target Performance</div>
                        <div class="group-row">
                            <div class="stat-box accent-call mini">
                                <span class="stat-value" id="stat-target-win">0</span>
                                <span class="stat-label">Win</span>
                            </div>
                            <div class="stat-box accent-put mini">
                                <span class="stat-value" id="stat-target-loss">0</span>
                                <span class="stat-label">Loss</span>
                            </div>
                        </div>
                    </div>
                    <div class="stat-column">
                        <div class="group-header">Time Performance</div>
                        <div class="group-row">
                            <div class="stat-box mini">
                                <span class="stat-value" id="stat-expired-win">0</span>
                                <span class="stat-label">Win</span>
                            </div>
                            <div class="stat-box mini">
                                <span class="stat-value" id="stat-expired-loss">0</span>
                                <span class="stat-label">Loss</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <main>
            <div class="filters">
                <input type="text" id="search" placeholder="Search Ticker...">
                <select id="direction-filter">
                    <option value="ALL">All Directions</option>
                    <option value="CALL">CALL</option>
                    <option value="PUT">PUT</option>
                </select>
                <div class="toggle-group">
                    <label class="switch">
                        <input type="checkbox" id="show-closed">
                        <span class="slider round"></span>
                    </label>
                    <span class="toggle-text">Show Closed</span>
                </div>
                <div class="last-updated" id="last-updated">Last Updated: --</div>
            </div>

            <div class="grid" id="signals-grid">
                <!-- Cards will be dynamically injected here -->
            </div>
            
            <div id="loading" class="loading-state">
                <div class="spinner"></div>
                <p>Loading Verification Report...</p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
