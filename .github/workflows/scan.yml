name: Stock Scanner

on:
  schedule:
    # ⚠️ DST WARNING: GitHub Actions runs on UTC, which does NOT observe Daylight Saving Time.
    # - During EDT (Summer, ~March to Nov): Eastern Time is UTC-4.
    # - During EST (Winter, ~Nov to March): Eastern Time is UTC-5.
    # You will need to manually shift these UTC hours twice a year to keep the exact ET times.
    # The current settings below are configured for EDT (Summer):
    
    # Runs Mon–Fri at 9:35 AM ET (market open + 5 min) — 13:35 UTC
    - cron: "35 13 * * 1-5"
    # Runs Mon–Fri at 3:30 PM ET (30 min before close) — 19:30 UTC
    - cron: "30 19 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run Full Scan (bypass 1st level filter)'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run stock scanner
        env:
          # ── Notifications ──────────────────────────────────────────────────
          # Add in: Settings → Secrets and Variables → Actions → Secrets
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

          # ── TastyTrade credentials (REQUIRED for options intelligence) ──────
          # Add BOTH in: Settings → Secrets and Variables → Actions → Secrets
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}

          # ── Stock universe overrides (OPTIONAL) ────────────────────────────
          # Add in: Settings → Secrets and Variables → Actions → Variables
          #
          # Option A: Filter to specific TastyTrade public watchlist names
          #   TASTYTRADE_WATCHLISTS: "Tasty,Liquid,High IV"
          #
          # Option B: Override with exact tickers (highest priority)
          #   WATCHLIST: "NVDA,TSLA,AMD,GOOGL,SPY"
          TASTYTRADE_WATCHLISTS: ${{ vars.TASTYTRADE_WATCHLISTS }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          if [ "${{ github.event.inputs.full_scan }}" == "true" ]; then
            node src/index.js --full-scan
          else
            node src/index.js
          fi
