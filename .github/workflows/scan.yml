name: Stock Scanner

on:
  repository_dispatch:
    types: [run-scan-api]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Create empty .env file
        run: touch .env

      - name: Run stock scanner
        env:
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}
          TASTYTRADE_WATCHLISTS: ${{ vars.TASTYTRADE_WATCHLISTS }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          SESSION="${{ github.event.client_payload.session || 'manual' }}"
          npm run scan -- --session $SESSION --full-scan

      - name: Commit history files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add history/
          git commit -m "Auto-record scan history and verifications" || echo "No changes to commit"
          git push
