name: Stock Scanner

on:
  schedule:
    - cron: "35 13 * * 1-5"
    - cron: "30 19 * * 1-5"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      full_scan:
        description: 'Run Full Scan'
        type: boolean
        required: false
        default: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run stock scanner
        env:
          # ── Notifications ──────────────────────────────────────────────────
          # Add in: Settings → Secrets and Variables → Actions → Secrets
          GOOGLE_CHAT_WEBHOOK: ${{ secrets.GOOGLE_CHAT_WEBHOOK }}

          # ── TastyTrade credentials (REQUIRED for options intelligence) ──────
          # Add BOTH in: Settings → Secrets and Variables → Actions → Secrets
          TASTYTRADE_CLIENT_SECRET: ${{ secrets.TASTYTRADE_CLIENT_SECRET }}
          TASTYTRADE_REFRESH_TOKEN: ${{ secrets.TASTYTRADE_REFRESH_TOKEN }}

          # ── Stock universe overrides (OPTIONAL) ────────────────────────────
          # Add in: Settings → Secrets and Variables → Actions → Variables
          #
          # Option A: Filter to specific TastyTrade public watchlist names
          #   TASTYTRADE_WATCHLISTS: "Tasty,Liquid,High IV"
          #
          # Option B: Override with exact tickers (highest priority)
          #   WATCHLIST: "NVDA,TSLA,AMD,GOOGL,SPY"
          TASTYTRADE_WATCHLISTS: ${{ vars.TASTYTRADE_WATCHLISTS }}
          WATCHLIST: ${{ vars.WATCHLIST }}
        run: |
          if [ "${{ github.event.inputs.full_scan }}" == "true" ]; then
            node src/index.js --full-scan
          else
            node src/index.js
          fi
